<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Galeri Download Gambar</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
}

header{
text-align:center;
padding:40px;
}

header h1{
color:gold;
margin-bottom:10px;
}

header p{
color:#ddd;
}

.gallery{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

gap:20px;

padding:30px;

}

.card{

background:#222;

border-radius:15px;

overflow:hidden;

box-shadow:0 0 15px rgba(0,0,0,.5);

transition:.3s;

}

.card:hover{

transform:translateY(-8px);

}

.card img{

width:100%;

height:250px;

object-fit:cover;

display:block;

}

.card h3{

padding:15px;

text-align:center;

}

.card a{

text-decoration:none;

}

.card button{

width:90%;

margin:15px;

padding:12px;

background:gold;

border:none;

border-radius:10px;

cursor:pointer;

font-size:16px;

font-weight:bold;

}

.card button:hover{

background:orange;

}

footer{

text-align:center;

padding:30px;

color:#999;

}

</style>

</head>

<body>

<header>

<h1>GALERI DOWNLOAD GAMBAR</h1>

<p>Silakan pilih gambar yang ingin Anda download.</p>

</header>

<div class="gallery">

<div class="card">

<img src="images/1.png">

<h3>Wallpaper 1</h3>

<a href="images/1.png" download>

<button>⬇ Download</button>

</a>

</div>

<div class="card">

<img src="images/2.png">

<h3>Wallpaper 2</h3>

<a href="images/2.png" download>

<button>⬇ Download</button>

</a>

</div>

<div class="card">

<img src="images/3.png">

<h3>Wallpaper 3</h3>

<a href="images/3.png" download>

<button>⬇ Download</button>

</a>

</div>

<div class="card">

<img src="images/4.png">

<h3>Wallpaper 4</h3>

<a href="images/4.png" download>

<button>⬇ Download</button>

</a>

</div>

</div>

<footer>

Copyright © 2026

</footer>

</script>

</body>

</html>
