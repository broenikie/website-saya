<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Diskon & Hadiah #BR</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#111,#222,#333);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{

    width:420px;

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(12px);

    border-radius:20px;

    padding:30px;

    box-shadow:0 0 20px rgba(0,0,0,.4);

}

h1{

    text-align:center;

    color:gold;

    margin-bottom:20px;

}

label{

    color:white;

    display:block;

    margin-top:15px;

    margin-bottom:5px;

}

input,select{

    width:100%;

    padding:12px;

    border:none;

    border-radius:10px;

    font-size:16px;

}

button{

    width:100%;

    margin-top:20px;

    padding:15px;

    border:none;

    border-radius:10px;

    background:gold;

    font-size:18px;

    cursor:pointer;

    font-weight:bold;

}

button:hover{

    background:orange;

}

.result{

    margin-top:25px;

    background:#1f1f1f;

    border-radius:10px;

    padding:20px;

    color:white;

    line-height:2;

}

span{

    color:gold;

    font-weight:bold;

}
</style>

</head>

<body>

<div class="container">

<h1>Kalkulator Diskon & Hadiah Togel TOP1TOTO</h1>

<label>Nominal</label>

<input type="number" id="nominal" placeholder="Masukkan nominal">

<label>Pilih Program</label>

<select id="program">

<option value="6|1.5">COLOK BEBAS DISKON 6% KENA 1 ANGKA (Diskon 6% - Hadiah x1.5)</option>

<option value="6|3">COLOK BEBAS DISKON 6% KENA 2 ANGKA (Diskon 6% -  Hadiah x3)</option>

<option value="6|4.5">COLOK BEBAS DISKON 6% KENA 3 ANGKA (Diskon 6% -  Hadiah x4.5)</option>

<option value="6|6">COLOK BEBAS DISKON 6% KENA 4 ANGKA (Diskon 6% -  Hadiah x6)</option>

<option value="8|6">COLOK BEBAS 2D KENA 2 ANGKA (Diskon 8% - Hadiah x6)</option>

<option value="8|10">COLOK BEBAS 2D KENA 3 ANGKA (Diskon 8% - Hadiah x10)</option>

<option value="8|18">COLOK BEBAS 2D KENA 4 ANGKA (Diskon 8% - Hadiah x18)</option>

<option value="8|20">COLOK NAGA DISKON 8% KENA 3 ANGKA (Diskon 8% - Hadiah x20)</option>

<option value="8|30">COLOK NAGA DISKON 8% KENA 4 ANGKA  (Diskon 8% - Hadiah x30)</option>

<option value="6|7">COLOK JITU DISKON 6%(Diskon 6% - Hadiah x7)</option>

<option value="8|9">SHIO DISKON 8% (Diskon 8% - Hadiah x9)</option>

</select>

<button onclick="hitung()">Hitung</button>

<div class="result">

Nominal : <span id="a">0</span><br>

Diskon : <span id="b">0</span><br>

Setelah Diskon : <span id="c">0</span><br>

Hadiah : <span id="d">0</span><br>

Total : <span id="e">0</span>

</div>

</div>

<script>

function rupiah(x){

return "Rp "+Number(x).toLocaleString("id-ID");

}

function hitung(){

    let nominal = parseFloat(document.getElementById("nominal").value);

    if(isNaN(nominal)){
        alert("Masukkan nominal");
        return;
    }

    let data = document.getElementById("program").value.split("|");

    let diskon = parseFloat(data[0]);
    let pengaliHadiah = parseFloat(data[1]);

    let nilaiDiskon = nominal * diskon / 100;
    let setelahDiskon = nominal - nilaiDiskon;

    let hadiah = nominal * pengaliHadiah;

    let total = setelahDiskon + hadiah;

    document.getElementById("a").innerHTML = rupiah(nominal);
    document.getElementById("b").innerHTML = rupiah(nilaiDiskon);
    document.getElementById("c").innerHTML = rupiah(setelahDiskon);
    document.getElementById("d").innerHTML = rupiah(hadiah);
    document.getElementById("e").innerHTML = rupiah(total);
}

</script>

</body>
</html>
