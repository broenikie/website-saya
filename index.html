<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Diskon & Hadiah #BR</title>

<style>

    body {
    cursor: crosshair;
}
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Courier New", Consolas, monospace;
}

:root {
    --neon: #00ff88;
    --neon-blue: #00eaff;
    --dark: #050807;
    --panel: rgba(5, 15, 12, 0.88);
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;

    color: #fff;

    background:
        radial-gradient(circle at 20% 20%, rgba(0,255,136,.12), transparent 25%),
        radial-gradient(circle at 80% 80%, rgba(0,234,255,.10), transparent 25%),
        linear-gradient(135deg, #020403, #07100c 50%, #020504);

    position: relative;
    overflow-x: hidden;
}

/* GRID CYBER */
body::before {
    content: "";
    position: fixed;
    inset: 0;

    background-image:
        linear-gradient(rgba(0,255,136,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,136,.05) 1px, transparent 1px);

    background-size: 35px 35px;

    pointer-events: none;

    mask-image: linear-gradient(
        to bottom,
        transparent,
        black 20%,
        black 80%,
        transparent
    );
}

/* SCANLINE */
body::after {
    content: "";
    position: fixed;
    inset: 0;

    background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,255,136,.025) 4px
    );

    pointer-events: none;
}

/* MAIN CONTAINER */
.container {
    width: 440px;
    max-width: 100%;

    position: relative;

    padding: 30px;

    background: var(--panel);

    border: 1px solid rgba(0,255,136,.5);

    border-radius: 18px;

    backdrop-filter: blur(15px);

    box-shadow:
        0 0 10px rgba(0,255,136,.25),
        0 0 30px rgba(0,255,136,.12),
        inset 0 0 25px rgba(0,255,136,.04);

    animation: containerGlow 3s ease-in-out infinite alternate;
}

/* GARIS NEON ATAS */
.container::before {
    content: "";

    position: absolute;

    top: -1px;
    left: 10%;
    width: 80%;
    height: 2px;

    background: var(--neon);

    box-shadow:
        0 0 5px var(--neon),
        0 0 15px var(--neon),
        0 0 30px var(--neon);

    border-radius: 50%;
}

/* CORNER DECORATION */
.container::after {
    content: "ACCESS_GRANTED";

    position: absolute;

    right: 18px;
    top: 12px;

    font-size: 9px;

    color: var(--neon);

    opacity: .6;

    letter-spacing: 1px;

    text-shadow:
        0 0 5px var(--neon),
        0 0 10px var(--neon);
}

/* TITLE */
h1 {
    text-align: center;

    color: var(--neon);

    margin-bottom: 28px;

    font-size: 24px;

    letter-spacing: 1px;

    text-transform: uppercase;

    text-shadow:
        0 0 5px var(--neon),
        0 0 10px var(--neon),
        0 0 20px rgba(0,255,136,.7);

    animation: textFlicker 4s infinite;
}

/* LABEL */
label {
    display: block;

    margin-top: 17px;
    margin-bottom: 7px;

    color: #7fffd4;

    font-size: 13px;

    text-transform: uppercase;

    letter-spacing: 1px;

    text-shadow: 0 0 7px rgba(0,255,136,.5);
}

label::before {
    content: "> ";

    color: var(--neon);

    text-shadow:
        0 0 5px var(--neon),
        0 0 10px var(--neon);
}

/* INPUT & SELECT */
input,
select {
    width: 100%;

    padding: 13px 14px;

    border: 1px solid rgba(0,255,136,.4);

    border-radius: 8px;

    outline: none;

    background: rgba(0,0,0,.65);

    color: var(--neon);

    font-size: 15px;

    box-shadow:
        inset 0 0 10px rgba(0,255,136,.04),
        0 0 5px rgba(0,255,136,.05);

    transition: .25s ease;
}

/* INPUT PLACEHOLDER */
input::placeholder {
    color: rgba(0,255,136,.35);
}

/* SELECT OPTION */
select option {
    background: #07100c;
    color: var(--neon);
}

/* FOCUS */
input:focus,
select:focus {
    border-color: var(--neon);

    box-shadow:
        0 0 5px var(--neon),
        0 0 15px rgba(0,255,136,.35),
        inset 0 0 10px rgba(0,255,136,.08);

    transform: translateY(-1px);
}

/* BUTTON */
button {
    width: 100%;

    margin-top: 25px;

    padding: 15px;

    border: 1px solid var(--neon);

    border-radius: 8px;

    background: rgba(0,255,136,.08);

    color: var(--neon);

    font-family: "Courier New", monospace;

    font-size: 17px;

    font-weight: bold;

    letter-spacing: 2px;

    cursor: pointer;

    text-transform: uppercase;

    box-shadow:
        0 0 5px rgba(0,255,136,.5),
        inset 0 0 10px rgba(0,255,136,.08);

    text-shadow:
        0 0 5px var(--neon);

    transition: .25s ease;

    position: relative;

    overflow: hidden;
}

/* BUTTON LIGHT */
button::before {
    content: "";

    position: absolute;

    top: 0;
    left: -100%;

    width: 100%;
    height: 100%;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(0,255,136,.25),
        transparent
    );

    transition: .5s;
}

button:hover::before {
    left: 100%;
}

button:hover {
    color: #001a0d;

    background: var(--neon);

    box-shadow:
        0 0 5px var(--neon),
        0 0 15px var(--neon),
        0 0 30px rgba(0,255,136,.7);

    text-shadow: none;

    transform: translateY(-2px);
}

button:active {
    transform: scale(.98);
}

/* RESULT PANEL */
.result {
    margin-top: 25px;

    padding: 20px;

    background:
        linear-gradient(
            135deg,
            rgba(0,255,136,.07),
            rgba(0,0,0,.65)
        );

    border: 1px solid rgba(0,255,136,.3);

    border-radius: 10px;

    color: #baffdf;

    line-height: 2;

    font-size: 14px;

    position: relative;

    box-shadow:
        inset 0 0 20px rgba(0,255,136,.04),
        0 0 10px rgba(0,255,136,.05);
}

/* RESULT HEADER EFFECT */
.result::before {
    content: ">> CALCULATION_RESULT";

    display: block;

    margin-bottom: 10px;

    padding-bottom: 8px;

    border-bottom: 1px solid rgba(0,255,136,.2);

    color: var(--neon);

    font-size: 11px;

    letter-spacing: 1px;

    text-shadow:
        0 0 5px var(--neon);
}

/* RESULT VALUES */
.result span {
    float: right;

    color: var(--neon);

    font-weight: bold;

    text-shadow:
        0 0 5px var(--neon),
        0 0 10px rgba(0,255,136,.6);
}

/* TOTAL */
#e {
    color: var(--neon-blue);

    text-shadow:
        0 0 5px var(--neon-blue),
        0 0 12px var(--neon-blue),
        0 0 20px rgba(0,234,255,.6);
}

/* ANIMATION */
@keyframes containerGlow {
    from {
        box-shadow:
            0 0 10px rgba(0,255,136,.18),
            0 0 30px rgba(0,255,136,.08),
            inset 0 0 25px rgba(0,255,136,.03);
    }

    to {
        box-shadow:
            0 0 15px rgba(0,255,136,.3),
            0 0 40px rgba(0,255,136,.14),
            inset 0 0 30px rgba(0,255,136,.06);
    }
}

@keyframes textFlicker {
    0%, 18%, 20%, 22%, 65%, 67%, 100% {
        opacity: 1;
    }

    19%, 21%, 66% {
        opacity: .65;
    }
}

/* MOBILE */
@media (max-width: 480px) {
    body {
        padding: 12px;
    }

    .container {
        padding: 22px;

        border-radius: 15px;
    }

    h1 {
        font-size: 19px;

        padding-right: 5px;
    }

    .container::after {
        display: none;
    }

    input,
    select {
        font-size: 14px;
    }

    .result {
        font-size: 13px;
    }
}
</style>

</head>

<body>

<div class="container">

<h1>KALKULATOR PERHITUNGAN COLOK BEBAS TOP1TOTO #BR</h1>

<label>Nominal</label>

<input type="text" id="nominal" placeholder="Masukkan nominal" inputmode="numeric">

<label>Pilih Program</label>

<select id="program">

<option value="6|1.5">COLOK BEBAS DISKON 6% KENA 1 ANGKA (Diskon 6% - Hadiah x1.5)</option>

<option value="6|3">COLOK BEBAS DISKON 6% KENA 2 ANGKA (Diskon 6% -  Hadiah x3)</option>

<option value="6|4.5">COLOK BEBAS DISKON 6% KENA 3 ANGKA (Diskon 6% -  Hadiah x4.5)</option>

<option value="6|6">COLOK BEBAS DISKON 6% KENA 4 ANGKA (Diskon 6% -  Hadiah x6)</option>

<option value="8|6">COLOK BEBAS 2D KENA 2 ANGKA (Diskon 8% - Hadiah x6)</option>

<option value="8|10">COLOK BEBAS 2D KENA 3 ANGKA (Diskon 8% - Hadiah x10)</option>

<option value="8|18">COLOK BEBAS 2D KENA 4 ANGKA (Diskon 8% - Hadiah x18)</option>

<option value="8|20">COLOK NAGA DISKON 8% KENA 3 ANGKA (Diskon 8% - Hadiah x20)</option>

<option value="8|30">COLOK NAGA DISKON 8% KENA 4 ANGKA  (Diskon 8% - Hadiah x30)</option>

<option value="6|7">COLOK JITU DISKON 6%(Diskon 6% - Hadiah x7)</option>

<option value="8|9">SHIO DISKON 8% (Diskon 8% - Hadiah x9)</option>

</select>

<button onclick="hitung()">Hitung</button>

<div class="result">

Nominal : <span id="a">0</span><br>

Diskon : <span id="b">0</span><br>

Setelah Diskon : <span id="c">0</span><br>

Hadiah : <span id="d">0</span><br>

Total : <span id="e">0</span>

</div>

</div>

<script>

function rupiah(x){
    return "Rp " + Number(x).toLocaleString("id-ID");
}


/* FORMAT NOMINAL SAAT MENGETIK */
const nominalInput = document.getElementById("nominal");

nominalInput.addEventListener("input", function(){

    let angka = this.value.replace(/\D/g, "");

    if(angka === ""){
        this.value = "";
        return;
    }

    this.value = Number(angka).toLocaleString("id-ID");

});


function hitung(){

    /* HAPUS TITIK SEBELUM DIHITUNG */
    let nominal = parseFloat(
        document.getElementById("nominal").value.replace(/\./g, "")
    );

    if(isNaN(nominal)){
        alert("Masukkan nominal");
        return;
    }

    let data = document
        .getElementById("program")
        .value
        .split("|");

    let diskon = parseFloat(data[0]);
    let pengaliHadiah = parseFloat(data[1]);

    let nilaiDiskon = nominal * diskon / 100;

    let setelahDiskon = nominal - nilaiDiskon;

    let hadiah = nominal * pengaliHadiah;

    let total = setelahDiskon + hadiah;


    document.getElementById("a").innerHTML =
        rupiah(nominal);

    document.getElementById("b").innerHTML =
        rupiah(nilaiDiskon);

    document.getElementById("c").innerHTML =
        rupiah(setelahDiskon);

    document.getElementById("d").innerHTML =
        rupiah(hadiah);

    document.getElementById("e").innerHTML =
        rupiah(total);
}

</script>
</body>
</html>
